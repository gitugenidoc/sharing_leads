<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecurAssure - Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Poppins", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div class="flex min-h-screen">
      <aside
        id="agent-sidebar"
        class="hidden md:flex w-64 shrink-0 flex-col bg-gray-900 p-6 text-white"
      >
        <div class="mb-8 flex items-center gap-3">
          <img src="/logo.png" alt="SecurAssure" class="h-16" />
        </div>

        <nav class="flex-1 space-y-2">
          <button
            onclick="refreshClients()"
            class="w-full flex items-center gap-3 rounded-lg bg-indigo-600 px-4 py-3 font-medium text-white transition hover:bg-indigo-700"
          >
            <span class="material-symbols-outlined">refresh</span>
            <span>Actualiser</span>
          </button>
          <button
            onclick="scrollToClients()"
            class="w-full flex items-center gap-3 rounded-lg px-4 py-3 font-medium text-gray-200 transition hover:bg-gray-800"
          >
            <span class="material-symbols-outlined">people</span>
            <span>Mes clients</span>
          </button>
        </nav>

        <button
          onclick="handleLogout()"
          class="mt-6 w-full flex items-center gap-3 rounded-lg px-4 py-3 font-medium text-red-300 transition hover:bg-red-900"
        >
          <span class="material-symbols-outlined">logout</span>
          <span>Déconnexion</span>
        </button>
      </aside>

      <main class="flex-1 overflow-hidden">
        <header
          class="flex items-center justify-between border-b border-gray-200 bg-white px-4 py-4 md:px-8"
        >
          <div class="flex items-center gap-3">
            <button
              onclick="toggleMobileMenu()"
              class="rounded-lg p-2 transition hover:bg-gray-100 md:hidden"
              aria-label="Menu"
            >
              <span class="material-symbols-outlined">menu</span>
            </button>
            <div>
              <h1 class="text-2xl font-bold">Mes clients</h1>
              <p class="text-sm text-gray-500">
                Portefeuille assigné depuis l'espace admin
              </p>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <span id="leads-count" class="text-sm font-semibold text-gray-600"
              >0 clients</span
            >
            <div
              id="user-avatar"
              class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-600 font-bold text-white"
            >
              A
            </div>
          </div>
        </header>

        <section class="h-[calc(100vh-73px)] overflow-y-auto p-4 md:p-8">
          <div
            id="clients-panel"
            class="overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm"
          >
            <div
              class="flex flex-col gap-4 border-b border-gray-200 p-4 md:flex-row md:items-center md:justify-between"
            >
              <div>
                <h2 class="text-lg font-semibold">Liste des clients</h2>
                <p id="status-message" class="text-sm text-gray-500">
                  Chargement...
                </p>
              </div>
              <div class="flex flex-col gap-3 sm:flex-row">
                <div class="relative">
                  <span
                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
                    style="font-size: 20px"
                    >search</span
                  >
                  <input
                    id="agent-search-input"
                    type="text"
                    oninput="applyClientFilters()"
                    placeholder="Rechercher..."
                    class="w-full rounded-lg border border-gray-300 py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 sm:w-64"
                  />
                </div>
                <select
                  id="status-filter"
                  onchange="applyClientFilters()"
                  class="rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="">Tous les statuts</option>
                  <option value="NEW">Nouveau</option>
                  <option value="CONTACTED">Contacté</option>
                  <option value="INTERESTED">Intéressé</option>
                  <option value="QUALIFIED">Qualifié</option>
                  <option value="CLOSED">Fermé</option>
                </select>
                <button
                  onclick="toggleSortClients()"
                  class="inline-flex items-center justify-center gap-2 rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium transition hover:bg-gray-50"
                >
                  <span class="material-symbols-outlined" style="font-size: 18px"
                    >sort</span
                  >
                  Trier
                </button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full min-w-[1280px] text-left">
                <thead class="bg-gray-50">
                  <tr>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold uppercase text-gray-700"
                    >
                      Nom
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold uppercase text-gray-700"
                    >
                      Prenom
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold uppercase text-gray-700"
                    >
                      Ville
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold uppercase text-gray-700"
                    >
                      Statut
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold uppercase text-gray-700"
                    >
                      Mutuelle
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold uppercase text-gray-700"
                    >
                      Prix
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold uppercase text-gray-700"
                    >
                      Commentaire
                    </th>
                    <th
                      class="px-6 py-3 text-right text-xs font-semibold uppercase text-gray-700"
                    >
                      Actions
                    </th>
                  </tr>
                </thead>
                <tbody id="leads-tbody" class="divide-y divide-gray-200">
                  <tr>
                    <td colspan="7" class="px-6 py-8 text-center text-gray-500">
                      Chargement des clients...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div
      id="client-detail-modal"
      class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
      style="display: none"
    >
      <div class="bg-white rounded-lg shadow-xl max-w-5xl w-full mx-4 p-6 max-h-[90vh] overflow-y-auto">
        <div class="mb-5 flex items-center justify-between gap-4">
          <h3 id="client-detail-title" class="text-lg font-bold text-gray-900">
            Fiche client
          </h3>
          <div class="flex gap-2">
            <button
              id="client-detail-mail-btn"
              type="button"
              class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700 transition"
            >
              Envoyer e-mail
            </button>
            <button
              type="button"
              onclick="closeClientDetails()"
              class="rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
            >
              Fermer
            </button>
          </div>
        </div>
        <div id="client-detail-body" class="grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-3"></div>
      </div>
    </div>

    <!-- EMAIL MODAL -->
    <div
      id="email-modal"
      class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
      style="display: none"
    >
      <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 p-6">
        <h3 class="text-lg font-bold text-gray-900 mb-4">Envoyer un e-mail</h3>
        <form onsubmit="handleSendMail(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Destinataire *</label>
            <input
              type="email"
              id="email-recipient"
              required
              readonly
              class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-600 focus:outline-none"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Sujet *</label>
            <input
              type="text"
              id="email-subject"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Message *</label>
            <textarea
              id="email-body"
              rows="12"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-sans text-sm"
            ></textarea>
          </div>
          
          <!-- Ethereal Preview Box -->
          <div id="email-preview-box" class="p-3 rounded-lg bg-blue-50 border border-blue-200 text-sm text-blue-800" style="display: none">
            <span class="font-semibold">Aperçu SMTP : </span>
            <a id="email-preview-link" href="#" target="_blank" class="underline font-medium hover:text-blue-900">Cliquez ici pour voir l'e-mail envoyé</a>.
          </div>

          <div class="flex gap-2 pt-2">
            <button
              type="button"
              onclick="closeEmailModal()"
              class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50"
            >
              Annuler
            </button>
            <button
              type="submit"
              id="email-submit-btn"
              class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition"
            >
              Envoyer
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      let allLeads = [];
      let sortAscending = true;

      window.addEventListener("load", () => {
        const user = getUser();
        if (!user) {
          window.location.href = "/index.html";
          return;
        }
        if (user.role === "ADMIN") {
          window.location.href = "/admin.html";
          return;
        }

        document.getElementById("user-avatar").textContent = (user.name || "A")
          .charAt(0)
          .toUpperCase();
        loadLeads();
      });

      async function loadLeads() {
        const tbody = document.getElementById("leads-tbody");
        const statusMessage = document.getElementById("status-message");
        try {
          statusMessage.textContent = "Chargement...";
          const data = await getUserLeads(0, 999999);
          allLeads = data.clients || [];
          updateCount(allLeads.length);
          applyClientFilters();
          statusMessage.textContent = `${allLeads.length} client(s) affiche(s)`;
        } catch (err) {
          console.error(err);
          statusMessage.textContent = err.formattedMessage || err.message;
          tbody.innerHTML =
            '<tr><td colspan="8" class="px-6 py-8 text-center text-red-600">Erreur serveur</td></tr>';
        }
      }

      function renderLeads(leads) {
        const tbody = document.getElementById("leads-tbody");
        if (!leads.length) {
          tbody.innerHTML =
            '<tr><td colspan="8" class="px-6 py-8 text-center text-gray-500">Aucun client assigné</td></tr>';
          updateCount(0);
          return;
        }

        tbody.innerHTML = leads
          .map(
            (lead) => `
              <tr class="hover:bg-gray-50">
                <td class="px-6 py-4">
                  <input data-client-field="nom" data-client-id="${lead.id}" value="${escapeHtml(lead.nom || "")}" class="w-36 rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </td>
                <td class="px-6 py-4">
                  <input data-client-field="prenom" data-client-id="${lead.id}" value="${escapeHtml(lead.prenom || "")}" class="w-36 rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </td>
                <td class="px-6 py-4">
                  <div class="flex min-w-64 gap-2">
                    <input data-client-field="ville" data-client-id="${lead.id}" value="${escapeHtml(lead.ville || "")}" class="w-36 rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    <input data-client-field="code_postal" data-client-id="${lead.id}" value="${escapeHtml(lead.code_postal || "")}" maxlength="5" class="w-24 rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                  </div>
                </td>
                <td class="px-6 py-4">
                  <select data-client-field="status" data-client-id="${lead.id}" class="rounded border border-gray-300 px-2 py-2 text-sm">
                    <option value="NEW" ${lead.status === "NEW" ? "selected" : ""}>Nouveau</option>
                    <option value="CONTACTED" ${lead.status === "CONTACTED" ? "selected" : ""}>Contacté</option>
                    <option value="INTERESTED" ${lead.status === "INTERESTED" ? "selected" : ""}>Intéressé</option>
                    <option value="QUALIFIED" ${lead.status === "QUALIFIED" ? "selected" : ""}>Qualifié</option>
                    <option value="CLOSED" ${lead.status === "CLOSED" ? "selected" : ""}>Fermé</option>
                  </select>
                </td>
                <td class="px-6 py-4">
                  <input data-client-field="nom_mutuelle" data-client-id="${lead.id}" value="${escapeHtml(lead.nom_mutuelle || "")}" class="w-44 rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </td>
                <td class="px-6 py-4">
                  <input data-client-field="prix_mutuelle" data-client-id="${lead.id}" type="number" min="0" step="0.01" value="${Number(lead.prix_mutuelle || 0).toFixed(2)}" class="w-28 rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </td>
                <td class="px-6 py-4">
                  <textarea
                    data-client-field="notes"
                    data-client-id="${lead.id}"
                    rows="2"
                    class="w-full min-w-64 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  >${escapeHtml(lead.notes || "")}</textarea>
                </td>
                <td class="px-6 py-4 text-right">
                  <div class="flex justify-end gap-2">
                    <button onclick="showClientDetails(${lead.id})" class="rounded-lg border border-indigo-200 px-3 py-2 text-sm font-medium text-indigo-700 transition hover:bg-indigo-50">
                      Fiche
                    </button>
                    <button onclick="saveLeadRow(${lead.id})" class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-indigo-700">
                      Enregistrer
                    </button>
                  </div>
                </td>
              </tr>
            `,
          )
          .join("");
        updateCount(leads.length);
      }

      function applyClientFilters() {
        const query = document
          .getElementById("agent-search-input")
          .value.trim()
          .toLowerCase();
        const status = document.getElementById("status-filter").value;
        const filtered = allLeads.filter((lead) => {
          const values = [
            lead.nom,
            lead.prenom,
            lead.ville,
            lead.code_postal,
            lead.nom_mutuelle,
            lead.status,
            lead.notes,
          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();
          return (!status || lead.status === status) && (!query || values.includes(query));
        });
        renderLeads(filtered);
        document.getElementById("status-message").textContent =
          `${filtered.length} client(s) affiche(s)`;
      }

      function toggleSortClients() {
        sortAscending = !sortAscending;
        allLeads.sort((a, b) => {
          const left = `${a.nom || ""} ${a.prenom || ""}`.toLowerCase();
          const right = `${b.nom || ""} ${b.prenom || ""}`.toLowerCase();
          return sortAscending
            ? left.localeCompare(right)
            : right.localeCompare(left);
        });
        applyClientFilters();
      }

      async function updateLeadStatus(leadId, status) {
        try {
          await updateLead(leadId, { status });
          const lead = allLeads.find((item) => item.id === leadId);
          if (lead) {
            lead.status = status;
          }
          applyClientFilters();
        } catch (err) {
          alert(err.formattedMessage || err.message);
          loadLeads();
        }
      }

      async function saveLeadRow(leadId) {
        const fields = document.querySelectorAll(
          `[data-client-id="${leadId}"][data-client-field]`,
        );
        const data = {};
        fields.forEach((field) => {
          data[field.dataset.clientField] = field.value;
        });
        data.prix_mutuelle = parseFloat(data.prix_mutuelle) || 0;

        try {
          const updatedLead = await updateLead(leadId, data);
          const index = allLeads.findIndex((item) => item.id === leadId);
          if (index >= 0) {
            allLeads[index] = updatedLead;
          }
          document.getElementById("status-message").textContent =
            "Ligne enregistrée.";
          applyClientFilters();
        } catch (err) {
          alert(err.formattedMessage || err.message);
          loadLeads();
        }
      }

      async function saveLeadComment(leadId, notes) {
        try {
          await updateLead(leadId, { notes });
          const lead = allLeads.find((item) => item.id === leadId);
          if (lead) {
            lead.notes = notes;
          }
        } catch (err) {
          alert(err.formattedMessage || err.message);
          loadLeads();
        }
      }

      function showClientDetails(leadId) {
        const lead = allLeads.find((item) => item.id === leadId);
        if (!lead) return;
        document.getElementById("client-detail-title").textContent =
          `${lead.nom || ""} ${lead.prenom || ""}`.trim() || "Fiche client";
        let extraData = {};
        try {
          extraData =
            typeof lead.extra_data === "string"
              ? JSON.parse(lead.extra_data || "{}")
              : lead.extra_data || {};
        } catch (err) {
          extraData = {};
        }
        const fields = [
          ["Civilite", lead.civilite],
          ["Nom", lead.nom],
          ["Prenom", lead.prenom],
          ["Profession", lead.profession],
          ["Adresse", [lead.adresse, lead.adresse2].filter(Boolean).join(" ")],
          ["Ville", `${lead.code_postal || ""} ${lead.ville || ""}`.trim()],
          ["Tel fixe", lead.tel_fixe],
          ["Tel GSM", lead.tel_gsm],
          ["E-mail", lead.email],
          ["Tel professionnel", lead.tel_professionnel],
          ["Date de naissance", lead.date_naissance],
          ["Naissance conjoint", lead.date_naissance_conjoint],
          ["Naissance enfant 1", lead.naissance_enfant_1],
          ["Naissance enfant 2", lead.naissance_enfant_2],
          ["Naissance enfant 3", lead.naissance_enfant_3],
          ["Regime TNS", lead.regime_tns],
          ["Regime", lead.regime],
          ["Regime conjoint", lead.regime_conjoint],
          ["Remboursement frais", lead.remboursement_frais],
          ["Besoins specifiques", lead.besoins_specifiques],
          ["Date assurance", lead.assurance_date],
          ["Mutuelle actuelle", lead.deja_mutuelle || lead.nom_mutuelle],
          ["Statut", lead.status],
          ["Notes", lead.notes],
        ];
        const extraFields = Object.entries(extraData)
          .filter(([, value]) => value !== undefined && value !== null && String(value).trim() !== "")
          .slice(0, 40);
        document.getElementById("client-detail-body").innerHTML =
          renderDetailFields(fields) +
          (extraFields.length
            ? `<div class="col-span-full pt-3 text-sm font-semibold text-gray-900">Colonnes importees</div>${renderDetailFields(extraFields)}`
            : "");

        const mailBtn = document.getElementById("client-detail-mail-btn");
        if (mailBtn) {
          mailBtn.onclick = () => openEmailModal(leadId);
        }

        document.getElementById("client-detail-modal").style.display = "flex";
      }

      function renderDetailFields(fields) {
        return fields
          .filter(([, value]) => value !== undefined && value !== null && String(value).trim() !== "")
          .map(
            ([label, value]) => `
              <div class="rounded-lg border border-gray-200 bg-gray-50 p-3">
                <p class="text-xs font-semibold uppercase text-gray-500">${escapeHtml(label)}</p>
                <p class="mt-1 whitespace-pre-wrap text-sm text-gray-900">${escapeHtml(value)}</p>
              </div>
            `,
          )
          .join("");
      }

      function closeClientDetails() {
        document.getElementById("client-detail-modal").style.display = "none";
      }

      let selectedLeadForMail = null;

      function openEmailModal(leadId) {
        const lead = allLeads.find((item) => item.id === leadId);
        if (!lead) return;
        if (!lead.email) {
          alert("Erreur : Ce client n'a pas d'adresse e-mail renseignée.");
          return;
        }
        selectedLeadForMail = lead;

        document.getElementById("email-recipient").value = lead.email;
        document.getElementById("email-subject").value = `Votre demande de mutuelle - SecurAssure`;

        // Prefill message body
        const civilite = lead.civilite || "M.";
        const name = lead.nom || "";
        const mutuelle = lead.deja_mutuelle || lead.nom_mutuelle || "Non renseignée";
        const prix = lead.prix_mutuelle ? `${Number(lead.prix_mutuelle).toFixed(2)} EUR` : "Non renseigné";
        const besoins = lead.besoins_specifiques || "Aucun besoin particulier spécifié";

        const body = `Bonjour ${civilite} ${name},

Nous faisons suite à votre demande de comparatif de mutuelle.

D'après vos informations actuelles :
- Votre mutuelle actuelle : ${mutuelle}
- Votre tarif actuel : ${prix}
- Vos besoins spécifiques : ${besoins}

Nous recherchons pour vous la meilleure couverture santé adaptée à vos besoins et au meilleur prix. Un de nos conseillers va prendre contact avec vous très rapidement.

Cordialement,
L'équipe SecurAssure`;

        document.getElementById("email-body").value = body;
        document.getElementById("email-preview-box").style.display = "none";
        document.getElementById("email-modal").style.display = "flex";
      }

      function closeEmailModal() {
        document.getElementById("email-modal").style.display = "none";
      }

      async function handleSendMail(event) {
        event.preventDefault();
        const submitBtn = document.getElementById("email-submit-btn");
        const recipient = document.getElementById("email-recipient").value;
        const subject = document.getElementById("email-subject").value;
        const body = document.getElementById("email-body").value;

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = "Envoi en cours...";

          const result = await sendMail(recipient, selectedLeadForMail ? selectedLeadForMail.nom : "", subject, body);

          alert("E-mail envoyé avec succès !");
          
          if (result && result.previewUrl) {
            const previewBox = document.getElementById("email-preview-box");
            const previewLink = document.getElementById("email-preview-link");
            previewLink.href = result.previewUrl;
            previewBox.style.display = "block";
            submitBtn.textContent = "Envoyé (voir aperçu)";
          } else {
            closeEmailModal();
          }
        } catch (err) {
          alert("Erreur lors de l'envoi de l'e-mail : " + err.message);
        } finally {
          submitBtn.disabled = false;
          if (submitBtn.textContent === "Envoi en cours...") {
            submitBtn.textContent = "Envoyer";
          }
        }
      }

      function updateCount(count) {
        document.getElementById("leads-count").textContent =
          `${count} client${count > 1 ? "s" : ""}`;
      }

      function scrollToClients() {
        document
          .getElementById("clients-panel")
          .scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function refreshClients() {
        loadLeads();
      }

      function toggleMobileMenu() {
        const sidebar = document.getElementById("agent-sidebar");
        sidebar.classList.toggle("hidden");
        sidebar.classList.toggle("flex");
      }

      function handleLogout() {
        logout();
        window.location.href = "/index.html";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
