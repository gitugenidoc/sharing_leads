<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SecurAssure - Connexion</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#d62d5a",
              surface: "#ffffff",
              background: "#f9fafa",
              border: "#eef0f2",
              textMain: "#1e293b",
              textMuted: "#64748b",
            },
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <style data-purpose="custom-utilities">
      body { background-color: #f3f4f6; padding: 2rem; min-height: 100vh; display: grid; place-items: center; }
      .card { background: white; border: 1px solid #f1f5f9; border-radius: 12px; padding: 1.25rem; box-shadow: 0 1px 2px 0 rgba(0,0,0,.05); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
  </head>
  <body class="text-textMain antialiased">
    <main class="w-full max-w-[420px]">
      <div class="card">
        <div class="mb-6">
          <h1 class="text-base font-semibold text-textMain">Connexion</h1>
          <p class="mt-1 text-sm text-textMuted">Acc&eacute;dez &agrave; votre espace clients mutuelle.</p>
        </div>

        <div class="mb-6">
          <div class="text-3xl font-semibold text-textMain">SecurAssure</div>
          <div class="text-xs text-green-600 mt-1">admin et agents</div>
        </div>

              <div id="login-form">
                <form onsubmit="handleLogin(event)" class="space-y-4">
                  <div id="login-error" style="display: none" class="p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100"></div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="email">Adresse e-mail</label>
                    <input autocomplete="email" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="email" name="email" placeholder="nom@entreprise.com" required type="email" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="password">Mot de passe</label>
                    <input autocomplete="current-password" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="password" name="password" placeholder="????????" required type="password" />
                  </div>
                  <button class="w-full py-1.5 border border-gray-200 rounded-md text-sm font-medium text-white bg-primary hover:bg-opacity-90 transition" type="submit">Se connecter</button>
                </form>
              </div>

              <div id="register-form" style="display: none">
                <form onsubmit="handleRegister(event)" class="space-y-4">
                  <div id="register-error" style="display: none" class="p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100"></div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="name">Nom complet</label>
                    <div class="relative">
                      <i class="fa-regular fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                      <input class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="name" name="name" placeholder="Nom complet" required type="text" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="reg-email">Adresse e-mail</label>
                    <div class="relative">
                      <i class="fa-regular fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                      <input class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="reg-email" name="reg-email" placeholder="nom@entreprise.com" required type="email" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="reg-password">Mot de passe</label>
                    <div class="relative">
                      <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                      <input class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="reg-password" name="reg-password" placeholder="????????" required type="password" />
                    </div>
                  </div>
                  <button class="w-full py-1.5 border border-gray-200 rounded-md text-sm font-medium text-white bg-primary hover:bg-opacity-90 transition" type="submit">S'inscrire</button>
                </form>
              </div>

              <div class="mt-4 text-center">
                <p id="toggle-text" class="text-xs text-textMuted">
                  Vous n'avez pas de compte?
                  <a class="text-primary hover:underline cursor-pointer font-medium" onclick="toggleForm()">S'inscrire</a>
                </p>
              </div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script>
      if (getToken()) {
        const user = getUser();
        window.location.href =
          user.role === "ADMIN" || user.role === "SUPER_ADMIN"
            ? "/admin.html"
            : "/agent.html";
      }

      function toggleForm() {
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const toggleText = document.getElementById("toggle-text");

        if (loginForm.style.display === "none") {
          loginForm.style.display = "block";
          registerForm.style.display = "none";
          toggleText.innerHTML =
            'Vous n\'avez pas de compte? <a class="text-primary hover:underline cursor-pointer font-medium" onclick="toggleForm()">S\'inscrire</a>';
        } else {
          loginForm.style.display = "none";
          registerForm.style.display = "block";
          toggleText.innerHTML =
            'Vous avez d&eacute;j&agrave; un compte? <a class="text-primary hover:underline cursor-pointer font-medium" onclick="toggleForm()">Se connecter</a>';
        }
      }

      async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("login-error");

        try {
          const data = await login(email, password);
          window.location.href =
            data.user.role === "ADMIN" || data.user.role === "SUPER_ADMIN"
              ? "/admin.html"
              : "/agent.html";
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.style.display = "block";
        }
      }

      async function handleRegister(event) {
        event.preventDefault();
        const name = document.getElementById("name").value;
        const email = document.getElementById("reg-email").value;
        const password = document.getElementById("reg-password").value;
        const errorDiv = document.getElementById("register-error");

        try {
          await register(email, password, name);
          alert("Inscription r\u00e9ussie! Veuillez vous connecter.");
          toggleForm();
          document.getElementById("email").value = "";
          document.getElementById("password").value = "";
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.style.display = "block";
        }
      }
    </script>
  </body>
</html>
