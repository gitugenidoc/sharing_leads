<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SecurAssure - Connexion</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#d62d5a",
              surface: "#ffffff",
              background: "#f9fafa",
              border: "#eef0f2",
              textMain: "#1e293b",
              textMuted: "#64748b",
            },
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <style data-purpose="custom-utilities">
      body { background-color: #f3f4f6; padding: 2rem; }
      .dashboard-container { background-color: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06); display: flex; height: calc(100vh - 4rem); max-width: 1600px; margin: 0 auto; border: 1px solid #e5e7eb; }
      .sidebar { width: 64px; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; align-items: center; padding: 1rem 0; }
      .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-color: #fafafa; }
      .topbar { height: 64px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 1.5rem; justify-content: space-between; background: white; }
      .content-area { flex: 1; overflow-y: auto; padding: 1.5rem; display: grid; place-items: center; }
      .card { background: white; border: 1px solid #f1f5f9; border-radius: 12px; padding: 1.25rem; box-shadow: 0 1px 2px 0 rgba(0,0,0,.05); }
      .mini-bar { width: 8px; border-radius: 2px; background-color: #f1f5f9; margin: 0 2px; display: inline-block; vertical-align: bottom; }
      .mini-bar.active { background-color: #e2e8f0; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
  </head>
  <body class="text-textMain antialiased">
    <div class="dashboard-container">
      <!-- BEGIN: Sidebar -->
      <nav class="sidebar bg-white">
        <div class="mb-8 w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white text-xl">
          <i class="fa-solid fa-envelope-open-text"></i>
        </div>
        <div class="flex flex-col gap-6 w-full items-center flex-1">
          <span class="text-primary border-r-2 border-primary w-full text-center py-1"><i class="fa-solid fa-border-all text-lg"></i></span>
          <span class="text-textMuted w-full text-center py-1"><i class="fa-regular fa-envelope text-lg"></i></span>
          <span class="text-textMuted w-full text-center py-1"><i class="fa-regular fa-user text-lg"></i></span>
          <span class="text-textMuted w-full text-center py-1"><i class="fa-solid fa-wand-magic-sparkles text-lg"></i></span>
        </div>
        <div class="flex flex-col gap-6 w-full items-center mt-auto">
          <span class="text-textMuted"><i class="fa-regular fa-circle-question text-lg"></i></span>
          <span class="text-textMuted"><i class="fa-solid fa-gear text-lg"></i></span>
          <span class="text-textMuted"><i class="fa-solid fa-rocket text-lg"></i></span>
        </div>
      </nav>
      <!-- END: Sidebar -->

      <!-- BEGIN: Main Content Area -->
      <div class="main-content">
        <!-- BEGIN: Topbar -->
        <header class="topbar">
          <div class="relative w-96">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
            <input class="w-full pl-9 pr-10 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" placeholder="SecurAssure espace de gestion" type="text" readonly />
            <div class="absolute right-3 top-1/2 transform -translate-y-1/2 flex items-center gap-1 text-gray-400 text-xs">
              <i class="fa-brands fa-apple"></i>
              <span>S</span>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden border border-gray-300 flex items-center justify-center text-xs font-semibold text-textMain">A</div>
            <button class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center hover:bg-opacity-90 transition" type="button">
              <i class="fa-solid fa-plus"></i>
            </button>
            <button class="w-8 h-8 rounded-lg bg-white border border-gray-200 text-primary flex items-center justify-center hover:bg-gray-50 transition relative" type="button">
              <i class="fa-regular fa-bell"></i>
            </button>
          </div>
        </header>
        <!-- END: Topbar -->

        <!-- BEGIN: Login Content -->
        <main class="content-area">
          <section class="w-full max-w-[420px]">
            <div class="card">
              <div class="mb-6 flex items-start justify-between gap-4">
                <div>
                  <h1 class="text-base font-semibold text-textMain">Connexion</h1>
                  <p class="mt-1 text-sm text-textMuted">Acc?dez ? votre espace clients mutuelle.</p>
                </div>
                <i class="fa-solid fa-ellipsis text-gray-400 cursor-pointer"></i>
              </div>

              <div class="mb-6 flex justify-between items-end">
                <div>
                  <div class="text-3xl font-semibold text-textMain">SecurAssure</div>
                  <div class="text-xs text-green-600 mt-1 flex items-center gap-1">
                    <i class="fa-solid fa-arrow-trend-up"></i> admin et agents
                  </div>
                </div>
                <div class="flex items-end h-8">
                  <div class="mini-bar h-4"></div>
                  <div class="mini-bar h-6 active"></div>
                  <div class="mini-bar h-8 active"></div>
                  <div class="mini-bar h-5 active"></div>
                </div>
              </div>

              <div id="login-form">
                <form onsubmit="handleLogin(event)" class="space-y-4">
                  <div id="login-error" style="display: none" class="p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100"></div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="email">Adresse e-mail</label>
                    <div class="relative">
                      <i class="fa-regular fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                      <input autocomplete="email" class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="email" name="email" placeholder="nom@entreprise.com" required type="email" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="password">Mot de passe</label>
                    <div class="relative">
                      <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                      <input autocomplete="current-password" class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="password" name="password" placeholder="????????" required type="password" />
                    </div>
                  </div>
                  <button class="w-full py-1.5 border border-gray-200 rounded-md text-sm font-medium text-white bg-primary hover:bg-opacity-90 transition" type="submit">Se connecter</button>
                </form>
              </div>

              <div id="register-form" style="display: none">
                <form onsubmit="handleRegister(event)" class="space-y-4">
                  <div id="register-error" style="display: none" class="p-3 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100"></div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="name">Nom complet</label>
                    <div class="relative">
                      <i class="fa-regular fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                      <input class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="name" name="name" placeholder="Nom complet" required type="text" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="reg-email">Adresse e-mail</label>
                    <div class="relative">
                      <i class="fa-regular fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                      <input class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="reg-email" name="reg-email" placeholder="nom@entreprise.com" required type="email" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-textMuted mb-1" for="reg-password">Mot de passe</label>
                    <div class="relative">
                      <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                      <input class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" id="reg-password" name="reg-password" placeholder="????????" required type="password" />
                    </div>
                  </div>
                  <button class="w-full py-1.5 border border-gray-200 rounded-md text-sm font-medium text-white bg-primary hover:bg-opacity-90 transition" type="submit">S'inscrire</button>
                </form>
              </div>

              <div class="mt-4 text-center">
                <p id="toggle-text" class="text-xs text-textMuted">
                  Vous n'avez pas de compte?
                  <a class="text-primary hover:underline cursor-pointer font-medium" onclick="toggleForm()">S'inscrire</a>
                </p>
              </div>
            </div>
          </section>
        </main>
        <!-- END: Login Content -->
      </div>
      <!-- END: Main Content Area -->
    </div>

    <script src="js/api.js"></script>
    <script>
      if (getToken()) {
        const user = getUser();
        window.location.href =
          user.role === "ADMIN" || user.role === "SUPER_ADMIN"
            ? "/admin.html"
            : "/agent.html";
      }

      function toggleForm() {
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const toggleText = document.getElementById("toggle-text");

        if (loginForm.style.display === "none") {
          loginForm.style.display = "block";
          registerForm.style.display = "none";
          toggleText.innerHTML =
            'Vous n\'avez pas de compte? <a class="text-primary hover:underline cursor-pointer font-medium" onclick="toggleForm()">S\'inscrire</a>';
        } else {
          loginForm.style.display = "none";
          registerForm.style.display = "block";
          toggleText.innerHTML =
            'Vous avez d?j? un compte? <a class="text-primary hover:underline cursor-pointer font-medium" onclick="toggleForm()">Se connecter</a>';
        }
      }

      async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("login-error");

        try {
          const data = await login(email, password);
          window.location.href =
            data.user.role === "ADMIN" || data.user.role === "SUPER_ADMIN"
              ? "/admin.html"
              : "/agent.html";
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.style.display = "block";
        }
      }

      async function handleRegister(event) {
        event.preventDefault();
        const name = document.getElementById("name").value;
        const email = document.getElementById("reg-email").value;
        const password = document.getElementById("reg-password").value;
        const errorDiv = document.getElementById("register-error");

        try {
          await register(email, password, name);
          alert("Inscription r?ussie! Veuillez vous connecter.");
          toggleForm();
          document.getElementById("email").value = "";
          document.getElementById("password").value = "";
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.style.display = "block";
        }
      }
    </script>
  </body>
</html>
